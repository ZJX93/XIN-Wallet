# ============================================
# 鑫钱包 · Android 客户端构建与发布
# 版本与 Web/后端共用同一套「安卓版本号」android-vX.Y.Z（由 auto-tag.yml 统一推导并派发），
# 因此 Docker 镜像与安卓 APK 永远版本对齐，不再维护独立的 Web 版本线。
# 触发：
#   - pull_request：仅做真编译验证（不发布）。
#   - workflow_dispatch（由 auto-tag.yml 派发，带 tag 输入）：编译 APK 并创建 GitHub Release。
# 版本号来源：优先使用派发的 tag（android-vX.Y.Z）；手动派发未带 tag 时自 latest android-v* 推导 patch+1。
# 产物：GitHub Release 里的 XIN-Wallet.android-vX.Y.Z.apk（debug 签名，可侧载安装，无需 Google Play）。
# ============================================
name: Android Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签（形如 android-vX.Y.Z），由 auto-tag 派生；留空则自动推导'
        required: false
        default: ''

# 同一分支同时仅允许一个构建，避免排队堆积
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 设置 JDK 17
        # AGP 8.7 + Kotlin 2.0.21 + Compose 编译器插件均要求 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 自动接受 SDK 许可协议（AGP 构建需要）
          accept-android-sdk-licenses: true

      - name: 安装编译所需 SDK 包
        # compileSdk/targetSdk = 34，需对应 platform 与 build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      - name: 计算安卓版本号
        id: android_version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            # 使用 auto-tag 派发的统一版本号（android-vX.Y.Z）
            VER=${TAG#android-v}
          else
            # 手动派发未带 tag 时的兜底：自 latest android-v* 推导 patch+1
            LATEST=$(git tag --list 'android-v*.*.*' --sort=-v:refname | head -1)
            if [ -z "$LATEST" ]; then
              VER="0.1.0"
            else
              VER=${LATEST#android-v}
              MAJOR=$(echo "$VER" | cut -d. -f1)
              MINOR=$(echo "$VER" | cut -d. -f2)
              PATCH=$(echo "$VER" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VER="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          NEW_TAG="android-v${VER}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_name=$VER" >> "$GITHUB_OUTPUT"
          echo "new_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Android version: $NEW_TAG (versionName=$VER, versionCode=$CODE)"

      - name: 编译 Debug APK（注入版本号）
        run: ./gradlew assembleDebug --no-daemon -PappVersionName="${{ steps.android_version.outputs.new_name }}" -PappVersionCode="${{ steps.android_version.outputs.new_code }}"

      - name: 重命名 APK 为 XIN-Wallet 格式
        if: success()
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          mv "$APK_DIR/app-debug.apk" "$APK_DIR/XIN-Wallet.${{ steps.android_version.outputs.new_tag }}.apk"
          echo "APK renamed to: XIN-Wallet.${{ steps.android_version.outputs.new_tag }}.apk"

      - name: 创建 GitHub Release 并上传 APK
        # 仅在工作流派发（auto-tag 触发的正式发布）时创建 Release；PR 编译校验不发布
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.android_version.outputs.new_tag }}" \
            --title "XIN-Wallet ${{ steps.android_version.outputs.new_tag }}" \
            --notes "自动构建的安卓 debug 安装包（debug 签名，可侧载安装，无需 Google Play）。\n\n安装方式：下载 XIN-Wallet.${{ steps.android_version.outputs.new_tag }}.apk 传到手机，允许「未知来源」后点击安装；或用 adb install XIN-Wallet.${{ steps.android_version.outputs.new_tag }}.apk。" \
            "android/app/build/outputs/apk/debug/XIN-Wallet.${{ steps.android_version.outputs.new_tag }}.apk"
