# ============================================
# 鑫钱包 · Android 客户端构建与发布
# 触发：PR / 主干 push（仅当 android/ 或本文件变更时）/ 手动 workflow_dispatch。
# 行为：Ubuntu runner 安装 JDK17 + Android SDK，执行 ./gradlew assembleDebug，
#       做真编译验证（非静态核对），随后自动创建 GitHub Release 并上传 APK 安装包。
# 版本：安卓端使用独立命名空间 android-vX.Y.Z，不污染 Web 端 v0.x 版本线，
#       每次成功构建 patch +1（首次 android-v0.1.0）。
# 产物：GitHub Release 里的 XIN-Wallet.android-vX.Y.Z.apk（debug 签名，可侧载安装，无需 Google Play）。
# ============================================
name: Android Build

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

# 同一分支同时仅允许一个构建，避免排队堆积
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 设置 JDK 17
        # AGP 8.7 + Kotlin 2.0.21 + Compose 编译器插件均要求 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 自动接受 SDK 许可协议（AGP 构建需要）
          accept-android-sdk-licenses: true

      - name: 安装编译所需 SDK 包
        # compileSdk/targetSdk = 34，需对应 platform 与 build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      - name: 计算安卓版本号
        id: android_version
        run: |
          LATEST=$(git tag --list 'android-v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEW=android-v0.1.0
          else
            VER=${LATEST#android-v}
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW="android-v${MAJOR}.${MINOR}.${PATCH}"
          fi
          VERNUM=${NEW#android-v}
          MAJOR=$(echo "$VERNUM" | cut -d. -f1)
          MINOR=$(echo "$VERNUM" | cut -d. -f2)
          PATCH=$(echo "$VERNUM" | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "new_tag=$NEW" >> "$GITHUB_OUTPUT"
          echo "new_name=$VERNUM" >> "$GITHUB_OUTPUT"
          echo "new_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Next Android version: $NEW (versionName=$VERNUM, versionCode=$CODE)"

      - name: 编译 Debug APK（注入版本号）
        run: ./gradlew assembleDebug --no-daemon -PappVersionName="${{ steps.android_version.outputs.new_name }}" -PappVersionCode="${{ steps.android_version.outputs.new_code }}"

      - name: 重命名 APK 为 XIN-Wallet 格式
        if: success()
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          mv "$APK_DIR/app-debug.apk" "$APK_DIR/XIN-Wallet.${{ steps.android_version.outputs.new_tag }}.apk"
          echo "APK renamed to: XIN-Wallet.${{ steps.android_version.outputs.new_tag }}.apk"

      - name: 创建 GitHub Release 并上传 APK
        if: success()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.android_version.outputs.new_tag }}" \
            --title "XIN-Wallet ${{ steps.android_version.outputs.new_tag }}" \
            --notes "自动构建的安卓 debug 安装包（debug 签名，可侧载安装，无需 Google Play）。\n\n安装方式：下载 XIN-Wallet.${{ steps.android_version.outputs.new_tag }}.apk 传到手机，允许「未知来源」后点击安装；或用 adb install XIN-Wallet.${{ steps.android_version.outputs.new_tag }}.apk。" \
            "android/app/build/outputs/apk/debug/XIN-Wallet.${{ steps.android_version.outputs.new_tag }}.apk"
