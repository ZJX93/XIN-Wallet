# ============================================
# 鑫钱包 · Android 客户端构建验证
# 触发：PR / 主干 push（仅当 android/ 或本文件变更时）。
# 行为：Ubuntu runner 安装 JDK17 + Android SDK，执行 ./gradlew assembleDebug，
#       做真编译验证（非静态核对），产物上传未签名 debug APK。
# 目标：确认安卓端代码可编译、依赖可解析——每次 push 自动跑，不靠本地 Android Studio。
# 注意：仅构建 debug，不签名发布；不触发镜像/打 tag（安卓端尚未独立定版本基线）。
# ============================================
name: Android Build

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

# 同一分支同时仅允许一个构建，避免排队堆积
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        # AGP 8.7 + Kotlin 2.0.21 + Compose 编译器插件均要求 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 自动接受 SDK 许可协议（AGP 构建需要）
          accept-android-sdk-licenses: true

      - name: 安装编译所需 SDK 包
        # compileSdk/targetSdk = 34，需对应 platform 与 build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xinwallet-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
