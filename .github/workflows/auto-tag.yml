# ============================================
# 鑫钱包 · 自动版本标签（统一版本线）
# 触发条件：PR Test Gate workflow 在 main 分支 push 后成功完成
# 行为：根据 Conventional Commits 规范自动计算版本号，创建并推送 vX.Y.Z tag
#       （整个仓库——Web/后端 + 安卓客户端——共用这一套版本号，保证镜像与 APK 版本对齐）
# 连锁效果：tag 创建后主动派发 release-image.yml（构建 Docker 镜像）与 android-build.yml（构建 APK），
#           二者均使用该 vX.Y.Z 标签，从而 Docker 镜像版本与安卓客户端版本始终保持一致。
# 版本规则（简化）：
#   版本号固定为 v0.0.Z —— 锁死 MAJOR.MINOR = 0.0，每次发布仅递增 PATCH(Z)。
#   例：v0.0.0 → v0.0.1 → v0.0.2 …（不再做 major/minor 跳变）。
#   是否发布仍取决于提交类型：docs/chore/ci 提交跳过打标签；
#   feat/fix/refactor/perf/build/style 提交才会触发一次 Z+1 发布。
# 注意：如需调整锁定的 X.Y，改下方 MAJOR/MINOR 两个常量即可。
# ============================================
name: Auto Tag

on:
  workflow_run:
    workflows: ["PR Test Gate"]
    types: [completed]
    branches: [main]

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    # 仅当 PR Test Gate 成功完成，且触发事件是 push（非 PR）
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    permissions:
      contents: write
      # 用于 gh workflow run 主动触发下游镜像构建（GITHUB_TOKEN 推送的 tag 不会触发其他 workflow）
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 计算下一个版本号
        id: version
        run: |
          # 获取按版本号排序的最新 tag
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "new_tag=v0.0.1" >> $GITHUB_OUTPUT
            echo "No existing tags, starting at v0.0.1"
            exit 0
          fi

          echo "Latest tag: $LATEST_TAG"

          # 解析当前版本号：仅取 PATCH(Z)；MAJOR.MINOR 锁死为 0.0
          VERSION=${LATEST_TAG#v}
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          MAJOR=0
          MINOR=0

          # 获取自上次 tag 以来的所有 commit 主题（首行）
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s")

          echo "Commits since ${LATEST_TAG}:"
          echo "$COMMITS"
          echo ""

          # 如果只有 docs/chore/ci 类型的 commit，跳过打标签（不发布）
          if ! echo "$COMMITS" | grep -qE "^(feat|fix|refactor|perf|build|style)(\(.+\))?!?:"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Only docs/chore/ci commits since last tag, skipping"
            exit 0
          fi

          # 锁死 X.Y = 0.0，版本号只递增 PATCH(Z)：v0.0.N → v0.0.(N+1)
          PATCH=$((PATCH + 1))

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "Bump type: patch (Z only, X.Y locked to 0.0)"
          echo "Next version: ${NEW_TAG}"

      - name: 创建并推送 tag
        if: steps.version.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" \
            -m "chore(release): ${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      # GITHUB_TOKEN pushed tags do not trigger other workflows (GitHub anti-loop)
      # Therefore we explicitly trigger downstream builds after tag creation
      - name: Trigger image build
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-image.yml \
            -f tag="${{ steps.version.outputs.new_tag }}" \
            -r main
          echo "Triggered release-image.yml for ${{ steps.version.outputs.new_tag }}"

      # 同源 tag 同时派发安卓构建，保证 APK 与镜像版本号完全一致
      - name: Trigger Android build
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run android-build.yml \
            -f tag="${{ steps.version.outputs.new_tag }}" \
            -r main
          echo "Triggered android-build.yml for ${{ steps.version.outputs.new_tag }}"

      # 同源 tag 同时派发鸿蒙构建，保证 HAP 与安卓 APK 版本号完全一致
      - name: Trigger Harmony build
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run harmony-build.yml \
            -f tag="${{ steps.version.outputs.new_tag }}" \
            -r main
          echo "Triggered harmony-build.yml for ${{ steps.version.outputs.new_tag }}"
